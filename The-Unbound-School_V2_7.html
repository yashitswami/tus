    :root {

      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-pill: 9999px;

      --transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      --header-height: 80px;
    }

    *, *::before, *::after {
