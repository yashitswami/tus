            max-width: 270px;

    }

    // 4. Render All 52 Properties as Interactive Circles
    properties.forEach(p => {
        const color = getColor(p.flats);
        const radius = p.flats >= 500 ? 10 : (p.flats >= 150 ? 7 : 5);
        
        L.circleMarker([p.lat, p.lon], {
            radius: radius,
            fillColor: color,
            color: '#000',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.85
