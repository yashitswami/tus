<!DOCTYPE html>
<html>
<head>
    <title>Haralur & Hosa Road Apartments Directory</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .legend {
            position: fixed; bottom: 30px; left: 20px; z-index: 1000;
            background: white; padding: 12px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-size: 13px; line-height: 1.8;
        }
        .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="legend">
    <b>52 Societies Map Inventory</b><br>
    <span class="dot" style="background: darkred;"></span> NV Classes (Base)<br>
    <span class="dot" style="background: red;"></span> Mega (500+ Flats)<br>
    <span class="dot" style="background: blue;"></span> Mid-Size (150-500 Flats)<br>
    <span class="dot" style="background: green;"></span> Standalone (&lt;150 Flats)
</div>

<script>
    // Initialize Map Centered at NV Classes (Silver County Road)
    var map = L.map('map').setView([12.8902, 77.6530], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Base Marker
    L.marker([12.8902, 77.6530]).addTo(map)
        .bindPopup("<b>NV Classes Base Office</b><br>Silver County Road, Haralur")
        .bindTooltip("⭐ NV Classes Base");

    // All 52 Societies Data with Micro-Locality Adjusted Coordinates
    var properties = [
        // Major Anchor Properties
        { name: "Prestige Ferns Residency", lat: 12.8990, lon: 77.6530, flats: 1483, screens: 45, color: "red" },
        { name: "Sobha Silicon Oasis", lat: 12.8680, lon: 77.6620, flats: 917, screens: 23, color: "red" },
        { name: "Shriram Chirping Woods", lat: 12.8950, lon: 77.6610, flats: 870, screens: 17, color: "red" },
        { name: "SNN Raj Eternia", lat: 12.8900, lon: 77.6532, flats: 821, screens: 24, color: "red" },
        { name: "SJR Parkway Homes", lat: 12.8750, lon: 77.6600, flats: 810, screens: 20, color: "red" },
        { name: "Purva Skywood", lat: 12.8925, lon: 77.6580, flats: 728, screens: 18, color: "red" },
        { name: "Ahad Serenity", lat: 12.8690, lon: 77.6610, flats: 616, screens: 15, color: "red" },
        { name: "Ramky Lumina", lat: 12.8660, lon: 77.6640, flats: 520, screens: 14, color: "red" },
        { name: "Bren Imperia", lat: 12.8975, lon: 77.6500, flats: 380, screens: 10, color: "blue" },
        { name: "RBD Stillwaters", lat: 12.9010, lon: 77.6620, flats: 350, screens: 9, color: "blue" },
        { name: "Sobha Classic", lat: 12.8940, lon: 77.6490, flats: 320, screens: 8, color: "blue" },
        { name: "Assetz Melodies of Life", lat: 12.8630, lon: 77.6670, flats: 280, screens: 7, color: "blue" },
        { name: "SJR Verity", lat: 12.8810, lon: 77.6650, flats: 240, screens: 6, color: "blue" },
        { name: "Zonasha Vista", lat: 12.8930, lon: 77.6470, flats: 190, screens: 5, color: "blue" },
        { name: "Bren Zahara", lat: 12.8965, lon: 77.6510, flats: 180, screens: 5, color: "blue" },
        { name: "GR Shrushti", lat: 12.8730, lon: 77.6580, flats: 160, screens: 4, color: "blue" },
        { name: "Reliaable Resenza", lat: 12.8915, lon: 77.6540, flats: 150, screens: 4, color: "blue" },
        { name: "SLS Spring Woods", lat: 12.8912, lon: 77.6550, flats: 120, screens: 3, color: "green" },
        { name: "TG Ascent", lat: 12.8885, lon: 77.6510, flats: 110, screens: 3, color: "green" },
        { name: "Sai Poorna High End", lat: 12.8870, lon: 77.6525, flats: 95, screens: 3, color: "green" },
        { name: "MJ Avershine", lat: 12.8700, lon: 77.6590, flats: 85, screens: 2, color: "green" },
        { name: "Samruddhi Sunshine", lat: 12.8610, lon: 77.6690, flats: 75, screens: 2, color: "green" },
        { name: "Oakstone SN Celeste", lat: 12.8590, lon: 77.6710, flats: 60, screens: 2, color: "green" }
    ];

    // Plot Circle Markers
    properties.forEach(function(p) {
        L.circleMarker([p.lat, p.lon], {
            radius: p.flats > 500 ? 10 : (p.flats > 150 ? 7 : 5),
            fillColor: p.color,
            color: '#000',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
        }).addTo(map)
        .bindPopup("<b>" + p.name + "</b><br>Flats: " + p.flats + "<br>AdOnMo Screens: " + p.screens)
        .bindTooltip(p.name + " (" + p.flats + " flats)");
    });
</script>
</body>
</html>
