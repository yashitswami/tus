<!doctype html><meta charset="utf-8">
<title>Klassik School — 3D Massing Model</title>
<style>
  :root{ --bg0:#12151b; --bg1:#0b0d11; --panel:rgba(22,26,33,.82); --line:#2b323d;
         --ink:#e7ebf0; --sub:#8b95a4; --accent:#d9a441; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;
     font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
     background:radial-gradient(120% 120% at 60% 10%,#1b2029 0%,var(--bg0) 45%,var(--bg1) 100%);}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:absolute;pointer-events:none}
  #title{top:20px;left:24px}
  #title h1{margin:0;font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  #title .s{margin-top:3px;font:11px/1.4 var(--mono);color:var(--sub);letter-spacing:.06em}
  /* section ruler / legend */
  #ruler{top:96px;left:24px;pointer-events:auto;width:186px}
  .lv{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;
      transition:background .15s;user-select:none}
  .lv:hover{background:rgba(255,255,255,.05)}
  .lv .sw{width:13px;height:13px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset}
  .lv .nm{font-size:12.5px;flex:1}
  .lv .el{font:10.5px/1 var(--mono);color:var(--sub)}
  .lv.off{opacity:.32}
  .lv.off .nm{text-decoration:line-through}
  #ruler .rail{position:absolute;left:14px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--line),transparent)}
  /* controls */
  #panel{right:24px;top:20px;pointer-events:auto;width:212px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:15px 16px;backdrop-filter:blur(10px)}
  #panel h2{margin:0 0 12px;font:600 10.5px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
  .row{margin:13px 0}
  .row label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--sub)}
  .row label b{color:var(--ink);font-family:var(--mono);font-weight:500}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn{flex:1;min-width:88px;text-align:center;font-size:11.5px;padding:8px 6px;border-radius:8px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.on{background:var(--accent);color:#161616;border-color:var(--accent);font-weight:600}
  #stats{left:24px;bottom:18px;font:11px/1.6 var(--mono);color:var(--sub)}
  #stats b{color:var(--ink)}
  #hint{right:24px;bottom:18px;font:11px/1.5 var(--mono);color:var(--sub);text-align:right;max-width:220px}
  #tag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font:10px/1 var(--mono);
       color:#5a6472;letter-spacing:.08em}
</style>

  requestAnimationFrame(frame);
  if(autoRot)tT+=0.0022;
  theta+=(tT-theta)*0.12;phi+=(tP-phi)*0.12;radius+=(tR-radius)*0.12;
  target.lerp(tTgt,0.12);
  applyCam();renderer.render(scene,camera);
}
applyCam();frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ---- UI ----
const ruler=document.getElementById('ruler');
const nice={Basement:'−3.50',Ground:'+0.00',First:'+3.60',Second:'+7.20',Third:'+10.80',Fourth:'+14.40'};
// build top-down (Fourth first)
[...DATA.levels].reverse().forEach(lv=>{
  const row=document.createElement('div');row.className='lv';row.dataset.name=lv.name;
  row.innerHTML=`<span class="sw" style="background:${lv.color}"></span>
    <span class="nm">${lv.name}</span><span class="el">${nice[lv.name]||''}</span>`;
  row.onclick=()=>{const g=levelMeshes.find(m=>DATA.levels[m.userData.idx].name===lv.name);
    g.visible=!g.visible;row.classList.toggle('off',!g.visible);};
  ruler.appendChild(row);
});

const explode=document.getElementById('explode'),expv=document.getElementById('expv');
explode.oninput=()=>{const f=explode.value/100;expv.textContent=explode.value+'%';
  levelMeshes.forEach(g=>{g.position.y=f*g.userData.idx*(size.y*0.28);});};
const opac=document.getElementById('opac'),opv=document.getElementById('opv');
opac.oninput=()=>{const o=opac.value/100;opv.textContent=opac.value+'%';
  levelMeshes.forEach(g=>{g.userData.mat.opacity=o;});};
const wire=document.getElementById('wire');
wire.onclick=()=>{wire.classList.toggle('on');const w=wire.classList.contains('on');
  levelMeshes.forEach(g=>{g.userData.mat.wireframe=w;g.userData.el.visible=!w;});};
const rot=document.getElementById('rot');
rot.onclick=()=>{autoRot=!autoRot;rot.classList.toggle('on',autoRot);};
document.getElementById('reset').onclick=()=>{tR=Math.max(size.x,size.z,size.y)*2.1;tT=Math.PI*0.72;tP=Math.PI*0.36;tTgt.set(0,size.y*0.42,0);
  explode.value=0;explode.oninput();opac.value=100;opac.oninput();};

document.getElementById('stats').innerHTML=
 `Footprint <b>${size.x.toFixed(1)} × ${size.z.toFixed(1)} m</b><br>`+
 `Height <b>${size.y.toFixed(1)} m</b> · Levels <b>6</b><br>`+
 `Walls from layer <b>2016-A-WALL</b> + others`;
</script>
